name: Release Multiplatform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: HEIC-Tools-Windows.zip
            asset_path: dist/HEIC-Tools-Windows.zip
          - os: ubuntu-latest
            artifact_name: HEIC-Tools-Linux
            asset_path: dist/HEIC-Tools-Linux
          - os: macos-latest
            artifact_name: HEIC-Tools-macOS.zip
            asset_path: dist/HEIC-Tools-macOS.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Build Windows
      - name: Build Windows Executable
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "HEIC-Tools" `
            --add-data "core;core" `
            --add-data "ui;ui" `
            main.py
          Compress-Archive -Path dist/HEIC-Tools -DestinationPath dist/HEIC-Tools-Windows.zip

      # Build Linux
      - name: Build Linux Binary
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "HEIC-Tools-Linux" \
            --add-data "core:core" \
            --add-data "ui:ui" \
            main.py
          chmod +x dist/HEIC-Tools-Linux

      # Build macOS
      - name: Build macOS App
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "HEIC-Tools" \
            --add-data "core:core" \
            --add-data "ui:ui" \
            main.py
          cd dist && zip -r HEIC-Tools-macOS.zip HEIC-Tools.app

      # Upload Release Assets automatically
      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
